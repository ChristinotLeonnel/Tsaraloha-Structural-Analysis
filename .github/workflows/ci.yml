# Intégration continue TSA — Linux (GCC) et Windows (MSVC), compilation Release, tests par suite, validation numérique.
#
# Les dépendances facultatives (OpenSees, Gmsh, IfcOpenShell) ne sont pas dans le dépôt (thirdparty/ non versionné) :
# les suites qui en dépendent sont rapportées « NON EXÉCUTÉE », jamais comptées comme réussies
# (tools/ci/run_test_suites.py). La validation numérique utilise le moteur interne Custom2D (sans dépendance externe).
# TSALab (cœur scientifique tsalab_science) est obligatoire : récupéré à côté de TSA.
#
# Versions : Linux Qt 6.12.0 (comme le poste Linux) ; Windows Qt 6.10.3 + MSVC 19.44 (Visual Studio 2022 des runners).
# Cette CI NE VALIDE PAS la configuration du poste Windows de développement (Qt 6.11.2, MSVC 19.51 / Visual Studio 2026) :
# Qt 6.11+ n'est pas installable par aqtinstall 3.3.0 (voir l'étape Qt du job windows).
#
# À faire avant de rendre ce pipeline bloquant : épingler les actions par SHA de commit, ajouter OpenSees Linux
# (compilation Conan 2, docs/LINUX_BUILD.md §7, mise en cache) et le SDK Gmsh avec empreinte vérifiée.

name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**", "refactor/**", "test/**", "build/**", "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TSALAB_REPOSITORY: ChristinotLeonnel/Tsaraloha-Structural-Analysis-Virtual-Laboratory
  OCCT_VERSION: "8.0.1"

jobs:
  checks:
    name: Dépendances et licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle des dépendances et licences
        run: python3 tools/ci/check_dependencies.py
      - name: Couches (model < graphics < widgets < app)
        run: python3 tools/check_layers.py
      - name: Raccourcis
        run: python3 tools/check_shortcuts.py --strict

  linux:
    name: Linux (Ubuntu 24.04, GCC, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: TSA
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TSALAB_REPOSITORY }}
          path: TSALab

      - name: Paquets système
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 xvfb \
            libfreetype-dev libfontconfig-dev libgl-dev libglu1-mesa-dev libx11-dev libxext-dev libxi-dev \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1

      - name: Qt 6.12.0 (version vérifiée sous Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Cache OpenCASCADE ${{ env.OCCT_VERSION }}
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: ~/opt/occt-${{ env.OCCT_VERSION }}
          key: occt-${{ env.OCCT_VERSION }}-ubuntu24.04-gcc13-v1

      - name: OpenCASCADE ${{ env.OCCT_VERSION }} (docs/LINUX_BUILD.md §2)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/build-deps && cd ~/build-deps
          curl -L --fail -o occt.tar.gz https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V8_0_1.tar.gz
          tar -xzf occt.tar.gz
          cmake -S OCCT-8_0_1 -B occt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$HOME/opt/occt-${OCCT_VERSION} -DCMAKE_INSTALL_RPATH='$ORIGIN' \
                -DBUILD_LIBRARY_TYPE=Shared -DBUILD_MODULE_ApplicationFramework=ON -DBUILD_MODULE_DataExchange=ON \
                -DBUILD_MODULE_Draw=OFF -DUSE_TK=OFF -DUSE_FREETYPE=ON -DUSE_OPENGL=ON -DUSE_XLIB=ON
          cmake --build occt-build -j "$(nproc)"
          cmake --install occt-build

      - name: Configuration (Release)
        run: |
          cmake -S TSA -B TSA/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$HOME/opt/occt-${OCCT_VERSION};${QT_ROOT_DIR}" \
                -DTSALAB_ROOT_DIR="$GITHUB_WORKSPACE/TSALab"

      - name: Compilation
        run: cmake --build TSA/build-ci -j "$(nproc)"

      - name: Tests par suite (affichage virtuel Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python3 TSA/tools/ci/run_test_suites.py --exe TSA/build-ci/TSA_TestSuite --out ci-report/tests \
              --available display --timeout 900

      - name: Contrôles CTest (couches, traductions)
        if: always()
        run: ctest --test-dir TSA/build-ci -R "Layers|I18nCheck" --output-on-failure

      - name: Validation numérique (moteur interne Custom2D)
        if: always()
        run: |
          mkdir -p ci-report/bench && cd ci-report/bench
          QT_QPA_PLATFORM=offscreen "$GITHUB_WORKSPACE/TSA/build-ci/TSA_Benchmark" --engine custom2d --out "$PWD"

      - name: Rapport
        if: always()
        run: |
          [ -f ci-report/tests/report.md ] && cat ci-report/tests/report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f ci-report/bench/latest.md ] && { echo; echo "## Validation numérique (Custom2D)"; cat ci-report/bench/latest.md; } >> "$GITHUB_STEP_SUMMARY"
          true

      - name: Archives du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-linux
          path: |
            ci-report/**/*.md
            ci-report/**/*.json
            ci-report/**/*.log
          retention-days: 30

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: TSA
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TSALAB_REPOSITORY }}
          path: TSALab

      - name: Environnement MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt 6.10.3 et non 6.11.2 (poste de développement) : depuis 6.11, le dépôt en ligne de Qt range les paquets Windows
      # par chaîne de compilation (qt6_6112_msvc2022_64/), organisation qu'aqtinstall 3.3.0 (dernière version) ne lit pas
      # (« Failed to locate XML data », exécution 40263952835). TSA exige Qt ≥ 6.2 et n'utilise aucune API propre à 6.11.
      - name: Qt 6.10.3 (Windows, MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache OpenCASCADE ${{ env.OCCT_VERSION }} (SDK MSVC téléchargé par CMake)
        uses: actions/cache@v4
        with:
          path: |
            TSA/opencascade-${{ env.OCCT_VERSION }}-vc14-64
            TSA/3rdparty-vc14-64
          key: occt-${{ env.OCCT_VERSION }}-vc14-64-v1

      - name: Configuration (Release)
        shell: pwsh
        run: |
          # /Z7 + /DEBUG : symboles de débogage (piles d'appels lisibles en cas de plantage, BUG-122), sans changer
          # l'optimisation de la Release (/O2).
          cmake -S TSA -B TSA/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Z7" `
                -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/DEBUG /OPT:REF /OPT:ICF" `
                -DCMAKE_SHARED_LINKER_FLAGS_RELEASE="/DEBUG /OPT:REF /OPT:ICF" `
                -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DTSA_AUTO_DOWNLOAD_DEPS=ON `
                -DTSALAB_ROOT_DIR="$env:GITHUB_WORKSPACE/TSALab"

      - name: Compilation
        shell: pwsh
        run: cmake --build TSA/build-ci -j 4   # au-delà, erreurs C3859 (mémoire des PCH) constatées sur poste

      - name: Tests par suite
        shell: pwsh
        run: python TSA/tools/ci/run_test_suites.py --exe TSA/build-ci/TSA_TestSuite.exe --out ci-report/tests --available display --timeout 900

      - name: Diagnostic — suite views sous le débogueur (pile d'appels, BUG-122)
        if: always()
        timeout-minutes: 30
        shell: pwsh
        run: |
          # Diagnostic seulement : le statut de la suite views reste celui de l'étape « Tests par suite » (cette étape
          # se termine toujours par exit 0 et ne modifie aucun rapport). À l'exception (violation d'accès 0xC0000005 ou
          # arrêt d'urgence 0xC0000409), cdb affiche le code (.exr -1), la pile du thread fautif (.ecxr ; kP) et celles
          # de tous les threads, puis quitte. -G : sortie automatique si la suite se termine sans exception.
          $cdb = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Debuggers\x64\cdb.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "ci-report/tests/views-cdb.log"
          New-Item -ItemType Directory -Force ci-report/tests/views-debug | Out-Null
          if (-not (Test-Path $cdb)) { "DIAGNOSTIC NON DISPONIBLE : cdb.exe absent du runner ($cdb)" | Tee-Object $log; exit 0 }
          $sym = "cache*$env:RUNNER_TEMP\symbols;srv*https://msdl.microsoft.com/download/symbols;$env:GITHUB_WORKSPACE\TSA\build-ci"
          $onCrash = '.echo === EXCEPTION ===; .exr -1; .lastevent; .ecxr; kP 80; .echo === TOUS LES THREADS ===; ~*k 40; q'
          Push-Location ci-report/tests/views-debug
          & $cdb -G -lines -y $sym -logo $log -c "sxe -c `"$onCrash`" av; sxe -c `"$onCrash`" c0000409; g" `
              "$env:GITHUB_WORKSPACE/TSA/build-ci/TSA_TestSuite.exe" --suite=views
          $code = $LASTEXITCODE
          Pop-Location
          "=== fin du diagnostic (code de sortie de cdb : $code) ===" | Add-Content $log
          if (-not (Select-String -Path $log -Pattern "=== EXCEPTION ===" -Quiet)) { "AUCUNE EXCEPTION CAPTURÉE : voir le journal complet" | Add-Content $log }
          Select-String -Path $log -Pattern "ExceptionCode|ExceptionAddress|=== EXCEPTION|TSA_TestSuite!|TKOpenGl|TKV3d|opengl32|Qt6|AUCUNE|NON DISPONIBLE" |
              Select-Object -First 120 | ForEach-Object { $_.Line }
          exit 0

      - name: Contrôles CTest (couches, traductions)
        if: always()
        shell: pwsh
        run: ctest --test-dir TSA/build-ci -R "Layers|I18nCheck" --output-on-failure

      - name: Validation numérique (moteur interne Custom2D)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-report/bench | Out-Null
          Push-Location ci-report/bench
          & "$env:GITHUB_WORKSPACE/TSA/build-ci/TSA_Benchmark.exe" --engine custom2d --out "$PWD"
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Rapport
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci-report/tests/report.md) { Get-Content ci-report/tests/report.md | Add-Content $env:GITHUB_STEP_SUMMARY }
          if (Test-Path ci-report/bench/latest.md) { "`n## Validation numérique (Custom2D)" | Add-Content $env:GITHUB_STEP_SUMMARY; Get-Content ci-report/bench/latest.md | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Archives du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-windows
          path: |
            ci-report/**/*.md
            ci-report/**/*.json
            ci-report/**/*.log
          retention-days: 30
